name: Customer Mobile CI

on:
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/customer-mobile-ci.yml"
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/customer-mobile-ci.yml"

permissions:
  contents: read

concurrency:
  group: customer-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-native-ios:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript
        run: npm run type-check

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Export native iOS bundle
        run: npx expo export --platform ios --output-dir dist-ios
