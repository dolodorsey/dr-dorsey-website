name: Customer TestFlight

on:
  workflow_dispatch:
    inputs:
      submit_to_testflight:
        description: "Submit the completed iOS build to App Store Connect/TestFlight"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: customer-testflight
  cancel-in-progress: false

jobs:
  build-and-submit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      EAS_PROJECT_ID: ${{ secrets.CUSTOMER_EAS_PROJECT_ID }}
      EXPO_OWNER: ${{ secrets.EXPO_OWNER }}
      CUSTOMER_ASC_APP_ID: ${{ secrets.CUSTOMER_ASC_APP_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify required secure configuration
        shell: bash
        run: |
          test -n "$EXPO_TOKEN" || { echo "Missing EXPO_TOKEN"; exit 1; }
          test -n "$EAS_PROJECT_ID" || { echo "Missing CUSTOMER_EAS_PROJECT_ID"; exit 1; }
          test -n "$EXPO_OWNER" || { echo "Missing EXPO_OWNER"; exit 1; }
          if [ "${{ inputs.submit_to_testflight }}" = "true" ]; then
            test -n "$CUSTOMER_ASC_APP_ID" || { echo "Missing CUSTOMER_ASC_APP_ID"; exit 1; }
          fi

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify native dependencies
        run: npm run doctor

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Verify Expo project
        run: eas project:info --non-interactive

      - name: Build signed iOS application
        run: eas build --platform ios --profile production --non-interactive --wait

      - name: Configure App Store Connect application
        if: ${{ inputs.submit_to_testflight }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = 'eas.json';
          const config = JSON.parse(fs.readFileSync(path, 'utf8'));
          config.submit ||= {};
          config.submit.production ||= {};
          config.submit.production.ios ||= {};
          config.submit.production.ios.ascAppId = process.env.CUSTOMER_ASC_APP_ID;
          fs.writeFileSync(path, JSON.stringify(config, null, 2) + '\n');
          NODE

      - name: Submit latest build to TestFlight
        if: ${{ inputs.submit_to_testflight }}
        run: eas submit --platform ios --profile production --latest --non-interactive
